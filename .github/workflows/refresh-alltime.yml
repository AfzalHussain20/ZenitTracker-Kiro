name: refresh-alltime

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    name: Build and upload all-time Jira snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run all-time snapshot builder
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          node --experimental-strip-types scripts/refresh-alltime.ts
          node -e "const s=require('./alltime.json'); if(!Array.isArray(s.allTimeBugs)||!Array.isArray(s.allTimeAll)) process.exit(1); console.log('snapshot ok:', s.allTimeBugs.length, 'bugs /', s.allTimeAll.length, 'all')"

      - name: Upload compressed snapshot to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put alltime.json --binding "ALLTIME_KV" --path alltime.json.gz --remote